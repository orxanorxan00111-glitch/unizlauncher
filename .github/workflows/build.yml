name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4
      - run: gradle :app:assembleDebug --no-daemon
      - name: Commit APK back to repo
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/UnizLightControl.apk
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add dist/UnizLightControl.apk
          git commit -m "Build: UnizLightControl.apk [skip ci]" || echo "nothing to commit"
          git push
